name: preparo

packages:
  - apps/user/front/mobile

scripts:
  format:
    description: Format Dart code.
    run: dart format .

  format:check:
    description: Check formatting of Dart code.
    run: dart format --output none --set-exit-if-changed .

  analyze:
    description: Analyze Dart code.
    run: dart analyze . --fatal-infos

  test:
    description: Run tests in a specific package.
    run: dart test
    exec:
      concurrency: 1
    packageFilters:
      dirExists:
        - test
    env:
      MELOS_TEST: true

  activate:
    description: Activate the local version of melos for development.
    run: dart pub global activate --source="path" . --executable="melos"
      --overwrite

  activate:pub:
    description: Activate the published version of melos.
    run: dart pub global activate melos --overwrite
